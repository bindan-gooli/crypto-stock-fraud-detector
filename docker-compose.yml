version: '3.8'

services:
  dashboard:
    build: .
    ports:
      - "8502:8502"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app

  scalper:
    build: .
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    entrypoint: ["python3", "src/ultra_scalper.py"]
    depends_on:
      - dashboard
